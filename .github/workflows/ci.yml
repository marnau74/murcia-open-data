name: ci

# Calidad en cada cambio: sin red y en pocos minutos.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Sin rutas locales ni correos personales
        run: |
          if git grep -nIiE '([a-z]:[\\/]+users[\\/]|/home/[a-z0-9_-]+/|@(gmail|hotmail|outlook|yahoo)\.)' -- . ':!uv.lock'; then
            echo "Hay datos personales en el repositorio" && exit 1
          fi
      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Estilo del SQL
        run: uv run sqlfluff lint dbt/models dbt/tests/*.sql
      - name: Tests
        run: uv run pytest
      # dbt contra un warehouse hecho con los fixtures. Los tests que necesitan la
      # ingesta completa (etiqueta datos_completos) se ejecutan en publicar.yml.
      - name: dbt build (fixtures)
        env:
          MURCIA_WAREHOUSE: data/warehouse_ci.duckdb
        run: |
          uv run python scripts/warehouse_de_prueba.py "$MURCIA_WAREHOUSE"
          uv run dbt build --project-dir dbt --profiles-dir dbt --exclude tag:datos_completos

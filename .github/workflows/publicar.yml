name: publicar

# Pipeline completo con datos reales y publicación:
#   - web del informe y documentación de dbt en GitHub Pages (siempre);
#   - release de datos datos-AAAA-MM (solo en la ejecución mensual o a mano).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 3 * *"   # día 3 de cada mes: el INE ya ha publicado el mes anterior
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --frozen
      # Caché de la capa raw: los meses ya descargados de murciaturistica y la ingesta
      # del INE del mismo día no se vuelven a pedir.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Pipeline completo con Dagster (ingesta, bronze, silver, gold y comprobaciones)
        run: uv run dagster job execute -m murcia_data.definitions -j pipeline_mensual
      - name: Web del informe (desde gold)
        run: uv run python -m murcia_data.report.build_site
      - name: Documentación de dbt (con el grafo de linaje)
        run: |
          uv run dbt docs generate --project-dir dbt --profiles-dir dbt --static
          mkdir -p site/docs
          cp dbt/target/static_index.html site/docs/index.html
      - name: Paquete de datos (gold en Parquet y DuckDB, contrato y sumas)
        run: uv run python -m murcia_data.release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warehouse
          path: data/warehouse.duckdb
          retention-days: 1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publicar-web:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publicar-datos:
    needs: construir
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear la release y subir sus ficheros
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Crear o actualizar la release datos-AAAA-MM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          etiqueta="datos-$(date -u +%Y-%m)"
          version=$(jq -r .version_contrato release/contrato.json)
          desde=$(jq -r .periodo.desde release/contrato.json)
          hasta=$(jq -r .periodo.hasta release/contrato.json)
          tablas=$(jq -r '.tablas | to_entries | map("| `\(.key)` | \(.value.filas) |") | join("\n")' release/contrato.json)
          cat > notas.md <<NOTAS
          Datos de alojamiento turístico en la Región de Murcia de **${desde}** a **${hasta}** (INE y murciaturistica.es), capa gold del modelo en estrella.

          | Tabla | Filas |
          |---|--:|
          ${tablas}

          - \`*.parquet\`: una tabla por fichero.
          - \`murcia_turismo.duckdb\`: todas las tablas en el esquema \`gold\`.
          - \`contrato.json\`: contrato **${version}** (tablas, columnas y tipos).
          - \`SHA256SUMS\`: comprueba la descarga con \`sha256sum -c SHA256SUMS\`.

          Documentación y linaje: https://marnau74.github.io/murcia-open-data/docs/
          NOTAS
          if gh release view "$etiqueta" >/dev/null 2>&1; then
            gh release upload "$etiqueta" release/* --clobber
            gh release edit "$etiqueta" --notes-file notas.md
          else
            # --latest=false: la release destacada del repositorio es la del código (vX.Y.Z)
            gh release create "$etiqueta" release/* --title "Datos ${hasta}" --notes-file notas.md --latest=false
          fi

  # Segundo destino: el mismo proyecto dbt en Databricks (Unity Catalog, tablas Delta).
  # Solo en la ejecución mensual o a mano, y solo si el repositorio tiene los secretos de
  # Databricks; sin ellos el job no hace nada y el resto de la publicación no depende de él.
  publicar-databricks:
    needs: construir
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Comprobar la configuración
        id: config
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_HTTP_PATH" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Databricks no está configurado en este repositorio: se omite."
          fi
      - if: steps.config.outputs.activo == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.config.outputs.activo == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - if: steps.config.outputs.activo == 'true'
        name: Instalar dependencias (con el grupo databricks)
        run: uv sync --frozen --group databricks
      - if: steps.config.outputs.activo == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: warehouse
          path: data
      - if: steps.config.outputs.activo == 'true'
        uses: databricks/setup-cli@6a2e75f1f954d87503702c408deea63216c0799d # v1.18.0
      - if: steps.config.outputs.activo == 'true'
        name: Cargar bronze en Unity Catalog
        run: uv run python -m murcia_data.databricks
      - if: steps.config.outputs.activo == 'true'
        name: Desplegar el bundle y ejecutar dbt en Databricks
        run: |
          warehouse_id="${DATABRICKS_HTTP_PATH##*/}"
          databricks bundle deploy --var warehouse_id="$warehouse_id"
          databricks bundle run dbt_murcia_turismo --var warehouse_id="$warehouse_id"
      - if: steps.config.outputs.activo == 'true'
        name: Paridad de gold entre DuckDB y Databricks
        run: uv run python -m murcia_data.databricks paridad

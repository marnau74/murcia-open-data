version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencias:
        patterns: ["*"]
    # La versión de databricks-sdk la marca dbt-databricks: subirla sola daría un conjunto imposible de resolver.
    ignore:
      - dependency-name: databricks-sdk
  # Las acciones van fijadas por SHA (con la versión en un comentario): Dependabot actualiza las dos cosas.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ["*"]

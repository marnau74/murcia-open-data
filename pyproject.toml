[project]
name = "murcia-data"
version = "1.0.0"
description = "Plataforma de datos abiertos sobre el turismo en la Región de Murcia."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mario Arnau" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.5",
    "lxml>=5.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murcia_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # avisos de estilo
    "I",   # orden de imports
    "UP",  # sintaxis moderna de Python
    "B",   # errores habituales (bugbear)
    "SIM", # simplificaciones
    "PD",  # buenas prácticas de pandas
]

# Sin secretos: DuckDB es un fichero local. La ruta se puede cambiar con
# MURCIA_WAREHOUSE (la CI la apunta a un warehouse de prueba).
murcia_turismo:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('MURCIA_WAREHOUSE', 'data/warehouse.duckdb') }}"
      threads: 4
    # Segundo destino: Databricks (Unity Catalog, tablas Delta). Sin secretos en el
    # repositorio: el workspace y el warehouse llegan por variables de entorno, y la
    # autenticación es el token de DATABRICKS_TOKEN (CI) o, si no hay token, el inicio de
    # sesión OAuth de la CLI de Databricks (desarrollo local).
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      catalog: murcia_turismo
      schema: silver
      threads: 4
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      auth_type: "{{ '' if env_var('DATABRICKS_TOKEN', '') else 'oauth' }}"

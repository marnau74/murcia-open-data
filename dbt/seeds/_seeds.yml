version: 2

seeds:
  - name: series_ine
    description: >
      Catálogo de las series del INE que usa el proyecto, con sus dimensiones. Se genera
      con scripts/generar_catalogo_ine.py a partir de los metadatos estructurados del INE.
    columns:
      - name: codigo
        description: Código estable de la serie en el INE (p. ej. EOT1772).
        data_tests: [unique, not_null]
      - name: hecho
        data_tests:
          - accepted_values:
              arguments: {values: [demanda, oferta, precios]}
      - name: tipo_alojamiento
        data_tests:
          - accepted_values:
              arguments: {values: [hotel, apartamento, camping, rural]}
      - name: territorio
        data_tests: [not_null]
      - name: medida
        data_tests: [not_null]

  - name: destinos_murciaturistica
    description: >
      Filas que publica murciaturistica.es y su zona. Los 11 destinos y su agrupación en
      ciudad / costa / interior son la clasificación oficial del Instituto de Turismo.
    columns:
      - name: destino
        data_tests: [unique, not_null]
      - name: tipo_fila
        description: destino, subtotal, total_zona o total_region.
        data_tests:
          - accepted_values:
              arguments: {values: [destino, subtotal, total_zona, total_region]}

  - name: territorios
    description: >
      Territorios de las dos fuentes con su jerarquía. `nombre_en_fuente` es la etiqueta
      que publica murciaturistica (los destinos «(no desglosado)» los crea el proyecto).
    columns:
      - name: territorio_id
        data_tests: [unique, not_null]
      - name: padre_id
        data_tests:
          - relationships:
              arguments: {to: ref('territorios'), field: territorio_id}

  - name: tipos_alojamiento
    columns:
      - name: tipo_alojamiento_id
        data_tests: [unique, not_null]

  - name: residencias
    columns:
      - name: residencia_id
        data_tests: [unique, not_null]

  - name: excepciones_cuadre
    description: >
      Diferencias entre el INE y murciaturistica ya estudiadas y documentadas, que el
      test de validación cruzada no marca como error. Cada fila explica el motivo.
    data_tests:
      - unique_combination:
          arguments: {columns: [fecha_id, medida]}
    columns:
      - name: medida
        data_tests:
          - accepted_values:
              arguments: {values: [viajeros, pernoctaciones]}
      - name: motivo
        data_tests: [not_null]
